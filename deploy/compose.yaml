name: simple-mlops

services:
  # 수업용 tracking은 이 Compose 서비스다. Kubernetes overlay가 아니다.
  # Nginx Proxy Manager에 학생 VM마다 이미 등록되어 있다.
  #   https://mlflow-ttaN-pveX.apps.learn.mrml.dev → 게스트 :5000
  # 수강생은 그 URL을 AIQA_MLFLOW_TRACKING_URI로 쓴다.
  # Risk API용 ttaN-pveX(:80)이나 http://127.0.0.1:5000은 기록 경로가 아니다.
  # NPM이 공개 Host로 붙으므로 0.0.0.0:5000, --allowed-hosts *,
  # --cors-allowed-origins *가 필요하다. Host만 열면 브라우저 POST가 403이 된다.
  mlflow:
    build:
      context: ..
      dockerfile: apps/model_trainer/Dockerfile
      target: release
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////runtime/mlflow/mlflow.db
      - --artifacts-destination
      - /runtime/mlflow/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --allowed-hosts
      - "*"
      - --cors-allowed-origins
      - "*"
      - --workers
      - "1"
    ports:
      - "0.0.0.0:${AIQA_MLFLOW_BIND_PORT:-5000}:5000"
    volumes:
      - ../artifacts/mlflow:/runtime/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  risk-api:
    image: ghcr.io/seungbaeji/tta-aiqa-risk-api@sha256:7d2cc40f88c914c64ca53727531f8bab7210f928cb40fa2227807031e1eb825f
    build:
      context: ..
      dockerfile: apps/risk_api/Dockerfile
      target: release
    environment:
      AIQA_API_ENVIRONMENT: compose
      AIQA_API_MODEL_BACKEND: local
      AIQA_API_API_CONFIG_PATH: /runtime/configs/serving/api.yaml
      AIQA_API_FEATURE_CONTRACT_PATH: /runtime/configs/contracts/model-input.yaml
      AIQA_API_TELEMETRY_CONFIG_PATH: /runtime/configs/observability/telemetry.yaml
      AIQA_API_MODEL_BUNDLE_PATH: /runtime/model/model.joblib
    ports:
      - "${AIQA_COMPOSE_BIND_HOST:-127.0.0.1}:8000:8000"
    volumes:
      - ../configs:/runtime/configs:ro
      - ../artifacts/models/revisions/v2/deployed:/runtime/model:ro
      - ./secrets/risk-api:/var/run/secrets/aiqa/risk-api:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  traffic-generator:
    profiles: ["traffic"]
    build:
      context: ..
      dockerfile: apps/traffic_generator/Dockerfile
      target: release
    environment:
      AIQA_TRAFFIC_ENVIRONMENT: compose
      AIQA_TRAFFIC_API_URL: http://risk-api:8000
      AIQA_TRAFFIC_TELEMETRY_CONFIG_PATH: /runtime/configs/observability/telemetry.yaml
      AIQA_TRAFFIC_SCENARIOS_PATH: /runtime/configs/traffic/scenarios.yaml
      AIQA_TRAFFIC_FEATURE_CONTRACT_PATH: /runtime/configs/contracts/model-input.yaml
      AIQA_TRAFFIC_PATIENT_POOL_PATH: /runtime/data/operational.csv
      AIQA_TRAFFIC_RESPONSE_ARTIFACT_PATH: /runtime/artifacts/traffic/compose.jsonl
      AIQA_TRAFFIC_PORTABLE_RESPONSE_ARTIFACT_PATH: artifacts/traffic/compose.jsonl
      AIQA_TRAFFIC_PORTABLE_MANIFEST_PATH: artifacts/traffic/collection-session.json
    volumes:
      - ../configs:/runtime/configs:ro
      - ../data/splits-v2/operational.csv:/runtime/data/operational.csv:ro
      - ../artifacts:/runtime/artifacts
      - ./secrets/traffic-generator:/var/run/secrets/aiqa/traffic-generator:ro
    depends_on:
      risk-api:
        condition: service_healthy
