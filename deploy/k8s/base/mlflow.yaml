# Reference only. Do not add this file to kustomization.yaml resources.
# Overlays include the whole resources list and would apply it with Risk API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: tta-aiqa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
        app.kubernetes.io/part-of: tta-aiqa
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlflow
          # Digest pin is pending: the model-trainer image used by Compose
          # `mlflow server` has not been published to GHCR as an OCI digest.
          image: ghcr.io/seungbaeji/tta-aiqa-model-trainer
          imagePullPolicy: IfNotPresent
          command:
            - mlflow
            - server
            - --backend-store-uri
            - sqlite:////runtime/mlflow/mlflow.db
            - --artifacts-destination
            - /runtime/mlflow/artifacts
            - --host
            - 0.0.0.0
            - --port
            - "5000"
            - --allowed-hosts
            - "*"
            - --cors-allowed-origins
            - "*"
            - --workers
            - "1"
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: HOME
              value: /runtime/mlflow
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: mlflow-store
              mountPath: /runtime/mlflow
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: mlflow-store
          persistentVolumeClaim:
            claimName: course-mlflow
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: tta-aiqa
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mlflow
  ports:
    - name: http
      port: 80
      targetPort: http
