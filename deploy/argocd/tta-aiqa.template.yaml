apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: __TTA_AIQA_APP_NAME__
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/seungbaeji/tta-aiqa.git
    # The release renderer replaces placeholders. Do not apply this
    # template directly or point a course environment at a mutable branch.
    targetRevision: __TTA_AIQA_REVISION__
    path: deploy/k8s/__TTA_AIQA_OVERLAY__
  destination:
    __TTA_AIQA_DEST_REF__
    namespace: __TTA_AIQA_DEST_NAMESPACE__
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
