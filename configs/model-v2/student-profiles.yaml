# Student-development catalog. Official V2 freeze stays in profiles.yaml.
# Course-valid metrics are recorded for every configured max_iter step.
# sklearn early_stopping and inner tol stopping are not part of this catalog.
schema_version: 1
random_seed: 43
profiles:
  - name: candidate-c
    model_role: candidate
    candidate_id: candidate-c
    kind: mlp_classifier
    threshold: 0.35
    params:
      hidden_layer_sizes: [32, 16]
      activation: relu
      solver: adam
      alpha: 0.0001
      learning_rate_init: 0.001
      max_iter: 30
      batch_size: 64
      early_stopping: false
