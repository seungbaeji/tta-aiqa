stages:
  verify-source:
    cmd: python -m data_quality_pipeline.dvc_stage verify-source
    deps:
      - apps/data_quality_pipeline
      - configs/contracts/physionet-record.yaml
      - data/raw-physionet/LICENSE.txt
      - data/raw-physionet/Outcomes-a.txt
      - data/raw-physionet/set-a.zip
      - data/raw-physionet/source-manifest.yaml
      - packages/aiqa_data
    outs:
      - artifacts/data-quality/source-integrity.json

  extract:
    cmd: python -m data_quality_pipeline.dvc_stage extract
    deps:
      - apps/data_quality_pipeline
      - artifacts/data-quality/source-integrity.json
      - configs/contracts/physionet-record.yaml
      - data/raw-physionet/set-a.zip
    outs:
      - data/interim/set-a

  aggregate:
    cmd: python -m data_quality_pipeline.dvc_stage aggregate
    deps:
      - apps/data_quality_pipeline
      - artifacts/data-quality/source-integrity.json
      - configs/contracts/physionet-record.yaml
      - configs/data/aggregation.yaml
      - data/interim/set-a
      - data/raw-physionet/Outcomes-a.txt
      - packages/aiqa_data
    outs:
      - data/features.csv

  split:
    cmd: python -m data_quality_pipeline.dvc_stage split
    deps:
      - apps/data_quality_pipeline
      - data/features.csv
      - packages/aiqa_data
      - params.yaml
    params:
      - data.random_seed
      - data.train_ratio
      - data.valid_ratio
      - data.test_ratio
      - data.operational_ratio
    outs:
      - data/splits-v1

  revise-split-v2:
    cmd: python -m data_quality_pipeline.dvc_stage revise-split
    deps:
      - apps/data_quality_pipeline
      - configs/data/split-v2.yaml
      - data/features.csv
      - data/splits-v1/split-manifest.csv
      - packages/aiqa_data
    outs:
      - data/splits-v2
