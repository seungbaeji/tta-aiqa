[project]
name = "aiqa-grafana-dashboard-importer"
version = "0.2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "aiqa-observability",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "requests>=2.32",
]

[project.scripts]
aiqa-grafana-dashboard = "grafana_dashboard_importer.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel]
only-include = [
  "__init__.py",
  "adapters",
  "application",
  "bootstrap.py",
  "domain",
  "main.py",
  "ports",
  "settings.py",
]

[tool.hatch.build.targets.wheel.sources]
"." = "grafana_dashboard_importer"
