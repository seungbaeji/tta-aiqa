[project]
name = "aiqa-data-quality-pipeline"
version = "0.2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "aiqa-core",
  "aiqa-data",
  "aiqa-observability",
  "great-expectations>=1.5,<2",
  "pandas>=2.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
]

[project.scripts]
aiqa-data-quality = "data_quality_pipeline.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel]
only-include = [
  "__init__.py",
  "adapters",
  "application",
  "bootstrap.py",
  "domain",
  "dvc_stage.py",
  "main.py",
  "ports",
  "settings.py",
]

[tool.hatch.build.targets.wheel.sources]
"." = "data_quality_pipeline"
