[project]
name = "aiqa-core"
version = "0.2.0"
description = "Shared domain contracts for the AIQA V2 workspace"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel]
only-include = [
  "__init__.py",
  "adapters",
  "domain",
]

[tool.hatch.build.targets.wheel.sources]
"." = "aiqa_core"
